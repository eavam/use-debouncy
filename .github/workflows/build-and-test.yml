name: Build and Test

on:
  push:
    branches:
      - main
      - beta
  pull_request:

permissions:
  contents: read # for checkout

# Cancel superseded runs on the same ref, but never interrupt a release on main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: yarn install --immutable

      # Keyed on the lockfile so a Playwright bump invalidates the cached browsers
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # Must run through the workspace binary: a hardcoded version installs
      # browser revisions that do not match the installed test runner
      - name: Install Playwright browsers
        run: yarn playwright install --with-deps

      - name: Build application
        run: yarn build

      - name: Lint and check formatting
        run: |
          yarn oxlint
          yarn oxfmt --check

      - name: Run component tests
        run: yarn test

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Pack build
        run: yarn pack -o use-debouncy-pack.tgz

      # Lint what actually ships, not the working tree. Versions are pinned so
      # a new release of either tool cannot turn CI red on its own.
      - name: Lint published package
        run: |
          npx -y publint@0.3.22 use-debouncy-pack.tgz --strict
          npx -y @arethetypeswrong/cli@0.18.5 use-debouncy-pack.tgz

      - name: Smoke test published package
        working-directory: smoke
        run: |
          npm install ../use-debouncy-pack.tgz react react-dom
          node --test

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            lib
            use-debouncy-pack.tgz

  release:
    runs-on: ubuntu-latest
    needs: ['build-and-test']
    # Pull requests get no OIDC publishing identity, so this job can only fail
    # there. A red check on every PR is what blocks Renovate from automerging.
    if: github.event_name == 'push'
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # OIDC: authenticates the npm publish and signs provenance
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build application
        run: yarn build

      - name: Configure git identity
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            lib

      - name: Release
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Running release for main branch..."
            if npx -y should-semantic-release@0.3.5; then
              echo "Changes found that require a release. Running release-it..."
              yarn release --ci
            else
              echo "No changes found that require a release. Skipping release."
              exit 0
            fi
          else
            echo "Running dry-run release for other branches..."
            yarn release --ci --dry-run --no-git.commit --no-git.tag --no-git.push --no-github.release
          fi
